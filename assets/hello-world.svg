<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="100"
  viewBox="0 0 760 100"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Hello World terminal</title>
  <desc id="description">
    A simple two-line Hello World terminal message.
  </desc>

  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- Tüm bloğu ortalamak için grup -->
  <g transform="translate(192, 0)">
    <text
      x="0"
      y="48"
      fill="url(#textGradient)"
      font-family="'Courier New', Consolas, monospace"
      font-size="46"
      font-weight="500"
      text-anchor="start"
    >
      &gt; HELLO WORLD!
    </text>

    <text
      x="0"
      y="91"
      fill="#3fb950"
      font-family="'Courier New', Consolas, monospace"
      font-size="30"
      font-weight="400"
      text-anchor="start"
    >
      &gt;_
    </text>
  </g>
</svg>
