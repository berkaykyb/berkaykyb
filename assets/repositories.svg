<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="150"
  viewBox="0 0 760 150"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Public and private repositories</title>
  <desc id="description">
    Description of the projects stored in public and private repositories.
  </desc>

  <defs>
    <linearGradient id="publicGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20c852"/>
      <stop offset="100%" stop-color="#43d85f"/>
    </linearGradient>

    <linearGradient id="privateGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5424df"/>
      <stop offset="100%" stop-color="#833df1"/>
    </linearGradient>
  </defs>

  <!-- Public başlığı -->
  <rect
    x="120"
    y="6"
    width="120"
    height="34"
    rx="17"
    fill="url(#publicGradient)"
  />

  <text
    x="180"
    y="28"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="16"
    font-weight="600"
    text-anchor="middle"
  >
    Public
  </text>

  <!-- Private başlığı -->
  <rect
    x="520"
    y="6"
    width="120"
    height="34"
    rx="17"
    fill="url(#privateGradient)"
  />

  <text
    x="580"
    y="28"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="16"
    font-weight="600"
    text-anchor="middle"
  >
    Private
  </text>

  <!-- Ortadaki çizgi -->
  <line
    x1="380"
    y1="20"
    x2="380"
    y2="128"
    stroke="#9ca3af"
    stroke-width="1"
    opacity="0.8"
  />

  <!-- Public açıklaması -->
  <text
    x="180"
    y="72"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="12.5"
    font-weight="400"
    text-anchor="middle"
  >
    <tspan x="180" dy="0">My public repositories mostly</tspan>
    <tspan x="180" dy="19">include university projects,</tspan>
    <tspan x="180" dy="19">small experiments, and learning projects.</tspan>
  </text>

  <!-- Private açıklaması -->
  <text
    x="580"
    y="72"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="12.5"
    font-weight="400"
    text-anchor="middle"
  >
    <tspan x="580" dy="0">I keep my commercial products,</tspan>
    <tspan x="580" dy="19">field-related work, and major projects</tspan>
    <tspan x="580" dy="19">in private repositories.</tspan>
  </text>
</svg>
